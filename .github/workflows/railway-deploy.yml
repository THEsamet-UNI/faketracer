name: Deploy to Railway

on:
  push:
    branches: [ feature/deepfake-detector, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh

      - name: Railway diagnostics & Login (non-fatal)
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "--- Railway CLI diagnostics ---"
          which railway || true
          railway --version || true
          echo "RAILWAY_API_KEY set: ${RAILWAY_API_KEY:+yes}"
          if [ -n "${RAILWAY_API_KEY}" ]; then
            echo "RAILWAY_API_KEY length: ${#RAILWAY_API_KEY} (masked)"
            echo "Key preview: ${RAILWAY_API_KEY:0:4}...${RAILWAY_API_KEY: -4}"
          fi
          echo "RAILWAY_PROJECT_ID set: ${RAILWAY_PROJECT_ID:+yes}"
          echo "Attempting railway login (will not fail the job)"
          set +e
          railway login --apiKey "$RAILWAY_API_KEY" 2>&1 | sed -n '1,200p' || true
          echo "railway whoami (post-login) output:"
          railway whoami 2>&1 | sed -n '1,200p' || true
          set -e

      - name: Deploy to Railway
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: |
          if [ -z "${RAILWAY_API_KEY}" ] || [ -z "${RAILWAY_PROJECT_ID}" ]; then
            echo "Skipping Railway deploy: missing RAILWAY_API_KEY or RAILWAY_PROJECT_ID"
            exit 0
          fi
          # Deploy current repo to the specified Railway project/environment
          # Requires repository to be linked or project id provided.
          railway up --project "$RAILWAY_PROJECT_ID" --environment "${RAILWAY_ENVIRONMENT:-production}" --yes
