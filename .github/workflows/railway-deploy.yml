name: Deploy to Railway

on:
  push:
    branches: [ feature/deepfake-detector, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh

      - name: Railway diagnostics (tokens recommended)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "--- Railway CLI diagnostics ---"
          which railway || true
          railway --version || true
          echo "RAILWAY_API_TOKEN set: ${RAILWAY_API_TOKEN:+yes}"
          if [ -n "${RAILWAY_API_TOKEN}" ]; then
            echo "RAILWAY_API_TOKEN length: ${#RAILWAY_API_TOKEN} (masked)"
            echo "Token preview: ${RAILWAY_API_TOKEN:0:4}...${RAILWAY_API_TOKEN: -4}"
          fi
          echo "RAILWAY_TOKEN (project) set: ${RAILWAY_TOKEN:+yes}"
          echo "RAILWAY_PROJECT_ID set: ${RAILWAY_PROJECT_ID:+yes}"
          echo "NOTE: CI should provide either RAILWAY_TOKEN (project token) or RAILWAY_API_TOKEN (account/team token)."
          echo "Skipping interactive 'railway login' since the CLI no longer accepts --apiKey; using tokens instead."
          set +e
          if [ -n "${RAILWAY_API_TOKEN}" ]; then
            echo "railway whoami output (using RAILWAY_API_TOKEN):"
            RAILWAY_API_TOKEN="${RAILWAY_API_TOKEN}" railway whoami 2>&1 | sed -n '1,200p' || true
          else
            echo "railway whoami skipped (RAILWAY_API_TOKEN not set)"
          fi
          set -e

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: |
          if [ -z "${RAILWAY_PROJECT_ID}" ]; then
            echo "Skipping Railway deploy: missing RAILWAY_PROJECT_ID"
            exit 0
          fi
          if [ -z "${RAILWAY_TOKEN}" ] && [ -z "${RAILWAY_API_TOKEN}" ]; then
            echo "Skipping Railway deploy: missing authentication token (set RAILWAY_TOKEN or RAILWAY_API_TOKEN)"
            exit 0
          fi
          echo "Deploying with project: ${RAILWAY_PROJECT_ID} environment: ${RAILWAY_ENVIRONMENT:-production}"
          set +e
          # Run `railway up` with tokens provided via env; project/account tokens are supported by the CLI.
          RAILWAY_API_TOKEN="${RAILWAY_API_TOKEN}" RAILWAY_TOKEN="${RAILWAY_TOKEN}" \
            railway up --project "$RAILWAY_PROJECT_ID" --environment "${RAILWAY_ENVIRONMENT:-production}" --yes 2>&1 | tee railway_up.log
          rc=${PIPESTATUS[0]:-${?}}
          echo "railway up exit code: $rc"
          echo "--- railway up (first 500 lines) ---"
          sed -n '1,500p' railway_up.log || true
          echo "--- end output ---"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "railway up failed, exiting with $rc"
            exit $rc
          fi
